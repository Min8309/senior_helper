slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} / ${slides.length}  ${s.title}`;select.append(o)});
function render(i){current=Math.max(0,Math.min(slides.length-1,i));const s=slides[current];image.src=s.image;image.alt=`${current+1}장: ${s.title}`;select.value=current;prev.disabled=current===0;next.disabled=current===slides.length-1;document.getElementById('status').textContent=`${current+1} / ${slides.length} · ${s.title}`;document.getElementById('notes').textContent=s.notes.join('\n\n')||'슬라이드의 핵심 메시지를 중심으로 설명해 주세요.';const a=document.getElementById('actions');a.replaceChildren();s.links.forEach(url=>{const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.textContent=url.includes('youtube.com')?'프로젝트 숏폼 보기 ↗':url.includes('/blob/')?'원본 코드 보기 ↗':url.includes('github.com')?'GitHub 보기 ↗':'서비스 열기 ↗';a.append(link)});history.replaceState(null,'',`#slide-${current+1}`)}
prev.onclick=()=>render(current-1);next.onclick=()=>render(current+1);select.onchange=()=>render(Number(select.value));document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})};document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();render(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();render(current-1)}if(e.key==='Home')render(0);if(e.key==='End')render(slides.length-1)});render((Number(location.hash.replace('#slide-',''))||1)-1);
</script></body></html>
